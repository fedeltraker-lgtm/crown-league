<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - إدارة رسائل البطولات</title>
    <script src="check-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #888;
        }

        .championships-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .championship-item {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .championship-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .championship-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .championship-name {
            color: #FFD700;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .championship-details {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .enter-btn {
            background-color: #0088ff;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        .enter-btn:hover {
            background-color: #00aaff;
        }

        .chat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .chat-modal-content {
            background-color: #0a0a0a;
            border: 2px solid #FFD700;
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .chat-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #FFD700;
        }

        .chat-modal-header h2 {
            color: #FFD700;
            font-size: 1.3rem;
        }

        .close-chat {
            font-size: 1.8rem;
            cursor: pointer;
            color: #FFD700;
        }

        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 15px;
            background-color: #1a1a1a;
            color: #FFD700;
        }

        .message.sent .message-bubble {
            background-color: #FFD700;
            color: #000000;
        }

        .message-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #FFD700;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        .no-championships {
            text-align: center;
            padding: 80px 20px;
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .back-link a {
            color: #000000;
        }

        body.light-mode .championship-item {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .championship-name {
            color: #000000;
        }

        body.light-mode .chat-modal-content {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .chat-modal-header {
            border-bottom-color: #000000;
        }

        body.light-mode .close-chat {
            color: #000000;
        }

        body.light-mode .message-bubble {
            background-color: #e0e0e0;
            color: #000000;
        }

        body.light-mode .message.sent .message-bubble {
            background-color: #000000;
            color: #ffffff;
        }

        body.light-mode .chat-input {
            background-color: #f0f0f0;
            border-color: #000000;
            color: #000000;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link"><a href="dashboard.html">← العودة إلى لوحة التحكم</a></div>
        <h1>👑 إدارة رسائل البطولات</h1>
        <div class="subtitle">إرسال رسائل إلى المسجلين في كل بطولة</div>
        <div id="championshipsList" class="championships-list"></div>
    </div>

    <div class="chat-modal" id="chatModal">
        <div class="chat-modal-content">
            <div class="chat-modal-header">
                <h2 id="chatTitle">إرسال رسائل للبطولة</h2><span class="close-chat" id="closeChatBtn">&times;</span>
            </div>
            <div id="chatMessagesArea" class="chat-messages-area"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput"
                    placeholder="اكتب رسالتك هنا... (ستصل لجميع المسجلين)">
                <button class="send-btn" id="sendBtn">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let currentChampionship = null;
        let chatInterval = null;

        function getAdminUser() { return { username: '👑 الإدمن', email: 'admin@crownleague.com' }; }
        function loadAllChampionships() {
            const saved = localStorage.getItem('adminChampionships');
            return saved ? JSON.parse(saved) : [];
        }
        function getChampionshipById(id, list) { return list.find(c => c.id === id); }
        function loadChatMessages(championshipId) {
            const messages = localStorage.getItem(`private_chat_${championshipId}`);
            return messages ? JSON.parse(messages) : [];
        }
        function saveChatMessages(championshipId, messages) {
            localStorage.setItem(`private_chat_${championshipId}`, JSON.stringify(messages));
        }
        function displayChatMessages() {
            if (!currentChampionship) return;
            const messages = loadChatMessages(currentChampionship.id);
            const chatArea = document.getElementById('chatMessagesArea');
            const admin = getAdminUser();
            if (!chatArea) return;
            if (messages.length === 0) {
                chatArea.innerHTML = '<div style="text-align:center;color:#666;padding:40px;">💬 لا توجد رسائل بعد</div>';
                return;
            }
            chatArea.innerHTML = '';
            messages.forEach(msg => {
                const isSent = msg.username === admin.username;
                const div = document.createElement('div');
                div.className = `message ${isSent ? 'sent' : 'received'}`;
                div.innerHTML = `<div class="message-bubble">${msg.text}</div><div class="message-info">${msg.username} • ${msg.time}</div>`;
                chatArea.appendChild(div);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChampionship) return;
            const admin = getAdminUser();
            const messages = loadChatMessages(currentChampionship.id);
            messages.push({
                username: admin.username,
                text: text,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            saveChatMessages(currentChampionship.id, messages);
            input.value = '';
            displayChatMessages();
        }
        function startChatListener() {
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(() => {
                if (currentChampionship) displayChatMessages();
            }, 3000);
        }
        function stopChatListener() {
            if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
        }
        function openChat(championship) {
            currentChampionship = championship;
            document.getElementById('chatTitle').innerText = `إرسال رسائل - ${championship.name}`;
            displayChatMessages();
            document.getElementById('chatModal').style.display = 'flex';
            startChatListener();
        }
        function closeChat() {
            stopChatListener();
            document.getElementById('chatModal').style.display = 'none';
            currentChampionship = null;
        }
        function displayChampionships() {
            const container = document.getElementById('championshipsList');
            const allChampionships = loadAllChampionships();
            if (allChampionships.length === 0) {
                container.innerHTML = `<div class="no-championships"><div class="icon">🏆</div><h3>لا توجد بطولات</h3><p>قم بإضافة بطولات من صفحة إدارة البطولات</p><a href="admin-championship.html" style="color:#FFD700;">← إدارة البطولات</a></div>`;
                return;
            }
            let html = '';
            for (let champ of allChampionships) {
                const gameText = champ.game === 'pubg' ? 'ببجي' : 'فري فاير';
                html += `<div class="championship-item"><div class="championship-header"><div><div class="championship-name">${champ.name}</div><div class="championship-details">${gameText} | ${champ.type === 'solo' ? 'فردي' : (champ.type === 'duo' ? 'ثنائي' : 'فريق')} | المسجلون: ?</div></div><button class="enter-btn" data-id="${champ.id}">✏️ إرسال رسالة</button></div></div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('.enter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    const champ = getChampionshipById(id, allChampionships);
                    if (champ) openChat(champ);
                });
            });
        }
        document.getElementById('closeChatBtn').addEventListener('click', closeChat);
        window.addEventListener('click', (e) => { if (e.target === document.getElementById('chatModal')) closeChat(); });
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function loadTheme() {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        }
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                if (e.newValue === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            }
            if (e.key === 'adminChampionships') displayChampionships();
        });
        loadTheme();
        displayChampionships();
    </script>
</body>

</html>
