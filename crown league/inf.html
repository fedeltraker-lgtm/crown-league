<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - معلومات البطولات</title>
    <script src="check-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 30px;
            color: #CCCCCC;
        }

        /* شبكة البطولات */
        .championships-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .championship-card {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .championship-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .championship-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #1a1a1a;
        }

        .no-image {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: #666;
            font-size: 3rem;
        }

        .championship-info {
            padding: 15px;
        }

        .championship-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #FFD700;
        }

        .championship-game {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .championship-players {
            color: #00AA00;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* نافذة المسجلين */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #0a0a0a;
            border: 2px solid #FFD700;
            border-radius: 20px;
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #FFD700;
        }

        .modal-header h2 {
            color: #FFD700;
            font-size: 1.3rem;
        }

        .close-modal {
            font-size: 1.8rem;
            cursor: pointer;
            color: #FFD700;
            transition: 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.1);
        }

        .modal-body {
            padding: 20px;
        }

        /* جدول المسجلين */
        .players-table {
            width: 100%;
            border-collapse: collapse;
        }

        .players-table th,
        .players-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .players-table th {
            background-color: #1a1a1a;
            color: #FFD700;
            font-weight: bold;
        }

        .players-table tr:hover {
            background-color: #1a1a1a;
        }

        .empty-players {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .players-count {
            margin-bottom: 15px;
            color: #00AA00;
            font-weight: bold;
        }

        .championship-type-badge {
            display: inline-block;
            background-color: #1a1a1a;
            color: #FFD700;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .subtitle {
            color: #555;
        }

        body.light-mode .back-link a {
            color: #000000;
        }

        body.light-mode .championship-card {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .championship-name {
            color: #000000;
        }

        body.light-mode .modal-content {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .modal-header {
            border-bottom-color: #000000;
        }

        body.light-mode .modal-header h2 {
            color: #000000;
        }

        body.light-mode .close-modal {
            color: #000000;
        }

        body.light-mode .players-table th {
            background-color: #e0e0e0;
            color: #000000;
        }

        body.light-mode .players-table td {
            border-bottom-color: #ddd;
        }

        body.light-mode .players-table tr:hover {
            background-color: #f0f0f0;
        }

        body.light-mode .championship-type-badge {
            background-color: #e0e0e0;
            color: #000000;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="dashboard.html"></a>
        </div>

        <h1>📋 معلومات البطولات</h1>
        <div class="subtitle">جميع البطولات المتاحة - اضغط على أي بطولة لمعرفة المسجلين ومعلوماتهم</div>

        <div id="championshipsGrid" class="championships-grid">
            <div class="loading">⏳ جاري التحميل...</div>
        </div>
    </div>

    <!-- نافذة المسجلين -->
    <div class="modal" id="playersModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">المسجلون في البطولة</h2>
                <span class="close-modal" id="closeModalBtn">&times;</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let allChampionships = [];

        function loadChampionships() {
            const saved = localStorage.getItem('adminChampionships');
            if (!saved) {
                document.getElementById('championshipsGrid').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 4rem;">🏆</div>
                        <div style="color: #FFD700; font-size: 1.5rem; margin-top: 15px;">لا توجد بطولات حالياً</div>
                        <div style="color: #888; margin-top: 10px;">سيتم إضافة بطولات قريباً</div>
                    </div>
                `;
                return;
            }

            allChampionships = JSON.parse(saved);
            displayChampionships();
        }

        function getChampionshipPlayersWithInfo(championshipId) {
            let players = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('joined_')) {
                    const username = key.replace('joined_', '');
                    const joined = JSON.parse(localStorage.getItem(key));
                    if (joined.includes(championshipId)) {
                        const registrationKey = `registration_${username}_${championshipId}`;
                        const registrationData = localStorage.getItem(registrationKey);
                        let playerInfo = { username: username };
                        if (registrationData) {
                            const data = JSON.parse(registrationData);
                            playerInfo.gameName = data.gameName;
                            playerInfo.gameId = data.gameId;
                            playerInfo.teamName = data.teamName;
                        } else {
                            playerInfo.gameName = 'غير مسجل';
                            playerInfo.gameId = 'غير مسجل';
                            playerInfo.teamName = 'غير مسجل';
                        }
                        players.push(playerInfo);
                    }
                }
            }
            return players;
        }

        function getChampionshipGameText(champ) {
            if (champ.game === 'pubg') return '🎮 ببجي';
            if (champ.game === 'freefire') return '🔥 فري فاير';
            return '🎮 لعبة غير محددة';
        }

        function getChampionshipTypeText(champ) {
            if (champ.type === 'solo') return 'فردي (Solo)';
            if (champ.type === 'duo') return 'ثنائي (Duo)';
            if (champ.type === 'squad') return 'فريق (Squad)';
            return 'غير محدد';
        }

        function displayChampionships() {
            const grid = document.getElementById('championshipsGrid');

            if (allChampionships.length === 0) {
                grid.innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <div style="font-size: 4rem;">🏆</div>
                        <div style="color: #FFD700; font-size: 1.5rem; margin-top: 15px;">لا توجد بطولات حالياً</div>
                        <div style="color: #888; margin-top: 10px;">سيتم إضافة بطولات قريباً</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (let champ of allChampionships) {
                const players = getChampionshipPlayersWithInfo(champ.id);
                const gameText = getChampionshipGameText(champ);
                const gameIcon = champ.game === 'pubg' ? '🎮' : '🔥';

                html += `
                    <div class="championship-card" data-id="${champ.id}">
                        ${champ.imageData ?
                        `<img src="${champ.imageData}" class="championship-image" alt="${champ.name}">` :
                        `<div class="no-image">${gameIcon}</div>`
                    }
                        <div class="championship-info">
                            <div class="championship-name">${escapeHtml(champ.name)}</div>
                            <div class="championship-game">${gameText}</div>
                            <div class="championship-players">👥 عدد المسجلين: ${players.length}</div>
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;

            document.querySelectorAll('.championship-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.getAttribute('data-id'));
                    showPlayersModal(id);
                });
            });
        }

        function showPlayersModal(championshipId) {
            const championship = allChampionships.find(c => c.id === championshipId);
            if (!championship) return;

            const players = getChampionshipPlayersWithInfo(championshipId);
            const gameText = getChampionshipGameText(championship);
            const typeText = getChampionshipTypeText(championship);

            document.getElementById('modalTitle').innerHTML = `📋 المسجلون في ${championship.name}`;

            const modalBody = document.getElementById('modalBody');

            if (players.length === 0) {
                modalBody.innerHTML = `
                    <div class="empty-players">
                        <div style="font-size: 3rem;">👥</div>
                        <div style="margin-top: 15px;">لا يوجد لاعبون مسجلون في هذه البطولة بعد</div>
                    </div>
                `;
            } else {
                let tableHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                        <div class="players-count">👥 عدد المسجلين: ${players.length} لاعب</div>
                        <div class="championship-type-badge">🎮 ${gameText} | 👥 ${typeText}</div>
                    </div>
                    <table class="players-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>اسم المستخدم</th>
                                <th>🎮 اسم في اللعبة</th>
                                <th>🆔 ID</th>
                                <th>👥 اسم الفريق</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                players.forEach((player, index) => {
                    tableHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${escapeHtml(player.username)}</td>
                            <td>${escapeHtml(player.gameName || 'غير مسجل')}</td>
                            <td>${escapeHtml(player.gameId || 'غير مسجل')}</td>
                            <td>${escapeHtml(player.teamName || 'غير مسجل')}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;
                modalBody.innerHTML = tableHTML;
            }

            document.getElementById('playersModal').style.display = 'flex';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('playersModal').style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('playersModal')) {
                document.getElementById('playersModal').style.display = 'none';
            }
        });

        window.addEventListener('storage', () => {
            loadChampionships();
        });

        loadTheme();
        loadChampionships();
    </script>
</body>

</html>
