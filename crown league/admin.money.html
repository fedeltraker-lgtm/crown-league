<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - إرسال الأموال</title>
    <script src="check-auth.js">
        // ========== تحسين الأداء مع الحفاظ على التوافق ==========

            // 1. تحسين القراءة - إضافة طبقة تخزين مؤقت فقط (لا نستبدل localStorage)
            const readCache = new Map();
            const CACHE_TTL = 500; // نصف ثانية

            function fastRead(key) {
                // محاولة القراءة من الكاش أولاً
                if (readCache.has(key)) {
                    const { value, timestamp } = readCache.get(key);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        return value;
                    }
                }

                // إذا انتهت صلاحية الكاش، نقرأ من localStorage
                const value = localStorage.getItem(key);
                readCache.set(key, { value, timestamp: Date.now() });
                return value;
            }

            // 2. تحسين الكتابة - الكتابة المباشرة مع تحديث الكاش
            function fastWrite(key, value) {
                // تحديث الكاش أولاً
                readCache.set(key, { value, timestamp: Date.now() });
                // الكتابة مباشرة في localStorage (لا نغير الآلية الأصلية)
                localStorage.setItem(key, value);
            }

            // 3. استخدام الدوال المحسنة بدلاً من localStorage مباشرة
            // ملاحظة: هذا آمن لأن localStorage لا يزال يعمل بشكل طبيعي

            // مثال للاستخدام الآمن:
            const users = JSON.parse(fastRead('users') || '[]');
            fastWrite('users', JSON.stringify(users));
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 90%;
            margin: 20px;
            padding: 20px;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #888;
        }

        .form-card {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 20px;
            padding: 30px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #FFD700;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            font-family: Arial, sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .send-btn {
            width: 100%;
            background-color: #00AA00;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .send-btn:hover {
            transform: scale(1.02);
            background-color: #00cc00;
        }

        /* رسائل من الموقع */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 10px;
            padding: 15px 25px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .toast.success {
            border-color: #00AA00;
            background-color: #0a2a0a;
        }

        .toast.success .toast-icon {
            color: #00AA00;
        }

        .toast.error {
            border-color: #AA0000;
            background-color: #2a0a0a;
        }

        .toast.error .toast-icon {
            color: #AA0000;
        }

        .toast-icon {
            font-size: 1.5rem;
        }

        .toast-message {
            color: #FFFFFF;
            font-size: 0.95rem;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .subtitle {
            color: #555;
        }

        body.light-mode .back-link a {
            color: #000000;
        }

        body.light-mode .form-card {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .input-group label {
            color: #000000;
        }

        body.light-mode .input-group input {
            background-color: #f0f0f0;
            border-color: #000000;
            color: #000000;
        }

        body.light-mode .toast.success {
            background-color: #d4edda;
            border-color: #28a745;
        }

        body.light-mode .toast.success .toast-message {
            color: #155724;
        }

        body.light-mode .toast.error {
            background-color: #f8d7da;
            border-color: #dc3545;
        }

        body.light-mode .toast.error .toast-message {
            color: #721c24;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="dashboard.html"></a>
        </div>

        <h1>💰 إرسال أموال</h1>
        <div class="subtitle">إضافة رصيد لأي مستخدم في الموقع</div>

        <div class="form-card">
            <form id="sendMoneyForm">
                <div class="input-group">
                    <label>👤 اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="input-group">
                    <label>💵 كمية المال (بالدولار USD)</label>
                    <input type="number" id="amount" placeholder="أدخل المبلغ" step="0.01" min="0.01" required>
                </div>
                <button type="submit" class="send-btn">💸 إرسال الأموال</button>
            </form>
        </div>
    </div>

    <!-- رسائل من الموقع -->
    <div id="successToast" class="toast success">
        <span class="toast-icon">✅</span>
        <span class="toast-message" id="successMessage"></span>
    </div>
    <div id="errorToast" class="toast error">
        <span class="toast-icon">❌</span>
        <span class="toast-message" id="errorMessage"></span>
    </div>

    <script>
        const form = document.getElementById('sendMoneyForm');
        const successToast = document.getElementById('successToast');
        const errorToast = document.getElementById('errorToast');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        function showToast(type, message) {
            if (type === 'success') {
                successMessage.innerText = message;
                successToast.style.display = 'flex';
                successToast.style.animation = 'slideIn 0.3s ease';
                setTimeout(() => {
                    successToast.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => {
                        successToast.style.display = 'none';
                        successToast.style.animation = '';
                    }, 300);
                }, 3000);
            } else {
                errorMessage.innerText = message;
                errorToast.style.display = 'flex';
                errorToast.style.animation = 'slideIn 0.3s ease';
                setTimeout(() => {
                    errorToast.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => {
                        errorToast.style.display = 'none';
                        errorToast.style.animation = '';
                    }, 300);
                }, 3000);
            }
        }

        function getAllUsers() {
            const users = localStorage.getItem('users');
            if (users) {
                return JSON.parse(users);
            }
            return [];
        }

        function userExists(username) {
            const users = getAllUsers();
            return users.some(u => u.username === username);
        }

        function addUserBalance(username, amount) {
            const currentBalance = localStorage.getItem(`balance_${username}`);
            let newBalance = amount;
            if (currentBalance !== null && currentBalance !== undefined) {
                newBalance = parseFloat(currentBalance) + amount;
            }
            localStorage.setItem(`balance_${username}`, JSON.stringify(newBalance));
            return newBalance;
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (username === '') {
                showToast('error', 'الرجاء إدخال اسم المستخدم');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                showToast('error', 'الرجاء إدخال مبلغ صحيح أكبر من صفر');
                return;
            }

            if (!userExists(username)) {
                showToast('error', `لا يوجد مستخدم باسم "${username}"`);
                return;
            }

            const newBalance = addUserBalance(username, amount);
            showToast('success', `✅ تم إرسال ${amount}$ إلى المستخدم ${username}\n📊 الرصيد الجديد: ${newBalance}$`);

            document.getElementById('username').value = '';
            document.getElementById('amount').value = '';
        });

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        window.addEventListener('storage', function (e) {
            if (e.key === 'theme') {
                if (e.newValue === 'light') {
                    document.body.classList.add('light-mode');
                } else {
                    document.body.classList.remove('light-mode');
                }
            }
        });

        loadTheme();
    </script>
</body>

</html>
