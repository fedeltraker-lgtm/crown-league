<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - البطولات</title>
<link rel="icon" type="image/png" href="logo.png">
    <script src="check-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 30px;
            color: #CCCCCC;
        }

        .top-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 30px;
        }

        .currency-box {
            position: relative;
        }

        .currency-icon {
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #FFFFFF;
            filter: drop-shadow(0 0 5px #FFD700);
            transition: transform 0.2s;
            padding: 5px;
        }

        .currency-icon:hover {
            transform: scale(1.1);
        }

        .currency-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            z-index: 100;
            min-width: 100px;
        }

        .currency-menu button {
            background: none;
            border: none;
            padding: 10px 20px;
            color: #FFD700;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            font-family: Arial, sans-serif;
            transition: 0.2s;
            border-radius: 8px;
        }

        .currency-menu button:hover {
            background-color: #FFD700;
            color: #000000;
        }

        .games-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .filter-btn {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            color: #FFD700;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .filter-btn.active {
            background-color: #FFD700;
            color: #000000;
        }

        .championship-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .championship-card {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .championship-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .championship-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #1a1a1a;
        }

        .no-image {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: #666;
            font-size: 3rem;
        }

        .championship-info {
            padding: 20px;
        }

        .championship-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .championship-game {
            display: inline-block;
            background-color: #1a1a1a;
            color: #FFD700;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            margin-bottom: 10px;
        }

        .championship-desc {
            color: #CCCCCC;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .championship-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .championship-price {
            background-color: #00AA00;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .championship-type {
            background-color: #1a1a1a;
            color: #FFD700;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .register-btn {
            width: 100%;
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .register-btn.joined {
            background-color: #555;
            color: #ccc;
            cursor: default;
        }

        .register-btn.full {
            background-color: #AA0000;
            color: white;
            cursor: not-allowed;
        }

        .register-btn:hover:not(.joined):not(.full) {
            transform: scale(1.02);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .empty-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .empty-text {
            color: #888;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #0a0a0a;
            border: 2px solid #FFD700;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid #FFD700;
        }

        .modal-header h2 {
            color: #FFD700;
            font-size: 1.5rem;
        }

        .close-modal {
            font-size: 2rem;
            cursor: pointer;
            color: #FFD700;
            transition: 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.1);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .modal-no-image {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: #666;
            font-size: 4rem;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-label {
            font-weight: bold;
            color: #FFD700;
        }

        .info-value {
            color: #CCCCCC;
        }

        .description-box {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .description-text {
            color: #CCCCCC;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .register-input-group {
            text-align: right;
        }

        .register-input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #FFD700;
        }

        .register-input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }

        .confirm-register-btn {
            width: 100%;
            background-color: #00AA00;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .confirm-register-btn:hover {
            transform: scale(1.02);
            background-color: #00cc00;
        }

        .success-toast,
        .error-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 10px;
            padding: 15px 25px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        .success-toast {
            border-color: #00AA00;
            background-color: #0a2a0a;
        }

        .error-toast {
            border-color: #AA0000;
            background-color: #2a0a0a;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .subtitle {
            color: #555;
        }

        body.light-mode .back-link a {
            color: #000000;
        }

        body.light-mode .filter-btn {
            background-color: #ffffff;
            border-color: #000000;
            color: #000000;
        }

        body.light-mode .filter-btn.active {
            background-color: #000000;
            color: #ffffff;
        }

        body.light-mode .championship-card {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .championship-name {
            color: #000000;
        }

        body.light-mode .championship-desc {
            color: #555;
        }

        body.light-mode .championship-type {
            background-color: #e0e0e0;
            color: #000000;
        }

        body.light-mode .championship-game {
            background-color: #e0e0e0;
            color: #000000;
        }

        body.light-mode .no-image {
            background-color: #e0e0e0;
        }

        body.light-mode .empty-title {
            color: #000000;
        }

        body.light-mode .modal-content {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .modal-header {
            border-bottom-color: #000000;
        }

        body.light-mode .modal-header h2 {
            color: #000000;
        }

        body.light-mode .close-modal {
            color: #000000;
        }

        body.light-mode .info-row {
            border-bottom-color: #ddd;
        }

        body.light-mode .info-label {
            color: #000000;
        }

        body.light-mode .info-value {
            color: #555;
        }

        body.light-mode .description-box {
            background-color: #f0f0f0;
        }

        body.light-mode .description-text {
            color: #555;
        }

        body.light-mode .currency-icon {
            filter: drop-shadow(0 0 5px #000000);
            color: #FFFFFF;
        }

        body.light-mode .currency-menu {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .currency-menu button {
            color: #000000;
        }

        body.light-mode .currency-menu button:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link"><a href="dashboard.html">← العودة إلى لوحة التحكم</a></div>
        <h1>البطولات</h1>
        <div class="subtitle">جميع البطولات المتاحة للمشاركة</div>

        <div class="top-controls">
            <div class="currency-box">
                <button class="currency-icon" id="currencyIconBtn">💱</button>
                <div class="currency-menu" id="currencyMenu">
                    <button id="usdBtnMenu">USD</button>
                    <button id="sypBtnMenu">SYP</button>
                </div>
            </div>
        </div>

        <div class="games-filter">
            <button class="filter-btn active" data-game="all">الكل</button>
            <button class="filter-btn" data-game="pubg">ببجي</button>
            <button class="filter-btn" data-game="freefire">فري فاير</button>
        </div>

        <div id="championshipsGrid"></div>
    </div>

    <div class="modal" id="championshipModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">تفاصيل البطولة</h2><span class="close-modal" id="closeModalBtn">&times;</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="modal" id="registerInfoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="registerModalTitle">معلومات التسجيل</h2><span class="close-modal"
                    id="closeRegisterModalBtn">&times;</span>
            </div>
            <div class="modal-body" id="registerModalBody"></div>
        </div>
    </div>

    <div id="successToast" class="success-toast"><span>✅</span><span id="successMessage"></span></div>
    <div id="errorToast" class="error-toast"><span>❌</span><span id="errorMessage"></span></div>

    <script>
             const API_URL = '/.netlify/functions/champ';
           
            
            
        
        let currentFilter = 'all';
        let allChampionships = [];
        let currentChampionship = null;
        let currentCurrency = 'USD';
        const conversionRate = 100;

        function showSuccess(message) {
            document.getElementById('successMessage').innerText = message;
            document.getElementById('successToast').style.display = 'flex';
            setTimeout(() => { document.getElementById('successToast').style.display = 'none'; }, 3000);
        }

        function showError(message) {
            document.getElementById('errorMessage').innerText = message;
            document.getElementById('errorToast').style.display = 'flex';
            setTimeout(() => { document.getElementById('errorToast').style.display = 'none'; }, 3000);
        }

        function getConvertedPrice(priceUSD) {
            if (currentCurrency === 'USD') return { value: priceUSD, symbol: '$' };
            return { value: priceUSD * conversionRate, symbol: 'ل.س' };
        }

        function getCurrentUser() {
            const savedUser = localStorage.getItem('currentUser');
            return savedUser ? JSON.parse(savedUser) : { username: 'زائر', email: '' };
        }

        function getUserBalance() {
            const user = getCurrentUser();
            const balance = localStorage.getItem(`balance_${user.username}`);
            return balance ? parseFloat(balance) : 0;
        }

        function isUserJoined(championshipId) {
            const user = getCurrentUser();
            const joinedKey = `joined_${user.username}`;
            const joined = localStorage.getItem(joinedKey);
            return joined ? JSON.parse(joined).includes(championshipId) : false;
        }

        function addUserToChampionship(championshipId, registerData) {
            const user = getCurrentUser();
            const joinedKey = `joined_${user.username}`;
            let joined = localStorage.getItem(joinedKey);
            joined = joined ? JSON.parse(joined) : [];
            if (!joined.includes(championshipId)) {
                joined.push(championshipId);
                localStorage.setItem(joinedKey, JSON.stringify(joined));
            }
            localStorage.setItem(`registration_${user.username}_${championshipId}`, JSON.stringify(registerData));
        }

        function getCurrentPlayersCount(championshipId) {
            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('joined_')) {
                    let joined = JSON.parse(localStorage.getItem(key));
                    if (joined.includes(championshipId)) count++;
                }
            }
            return count;
        }

        function isChampionshipFull(championship) {
            return getCurrentPlayersCount(championship.id) >= (championship.maxPlayers || 100);
        }

        // دالة منفصلة لربط حدث زر التأكيد
        function attachConfirmButtonListener() {
            const confirmBtn = document.getElementById('finalRegisterBtn');
            if (confirmBtn) {
                // إزالة المستمع القديم إذا وجد
                const newBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

                newBtn.addEventListener('click', function (e) {
                    e.preventDefault();

                    const championship = currentChampionship;
                    if (!championship) {
                        showError('حدث خطأ، يرجى المحاولة مرة أخرى');
                        return;
                    }

                    const isSolo = championship.type === 'solo';
                    const gameName = document.getElementById('gameName')?.value.trim();
                    const gameId = document.getElementById('gameId')?.value.trim();
                    const teamName = document.getElementById('teamName')?.value.trim();

                    if (!gameName || !gameId) {
                        showError('الرجاء إدخال اسمك في اللعبة و ID الخاص بك');
                        return;
                    }

                    if (!isSolo && !teamName) {
                        showError('الرجاء إدخال اسم فريقك');
                        return;
                    }

                    const user = getCurrentUser();
                    let balance = getUserBalance();
                    let requiredAmount = championship.price;

                    if (currentCurrency === 'SYP') {
                        requiredAmount = championship.price * conversionRate;
                        balance = getUserBalance() * conversionRate;
                    }

                    if (balance >= requiredAmount) {
                        let newBalanceUSD = getUserBalance() - championship.price;
                        localStorage.setItem(`balance_${user.username}`, JSON.stringify(newBalanceUSD));

                        const registerData = { gameName, gameId, teamName: teamName || null, registeredAt: new Date().toLocaleString('ar-EG') };
                        addUserToChampionship(championship.id, registerData);
                        showSuccess(`تم تسجيلك بنجاح في بطولة: ${championship.name} وتم خصم ${requiredAmount} ${currentCurrency === 'USD' ? '$' : 'ل.س'} من رصيدك`);

                        document.getElementById('registerInfoModal').style.display = 'none';
                        displayChampionships();
                    } else {
                        showError(`رصيدك غير كافي. المطلوب: ${requiredAmount} ${currentCurrency === 'USD' ? '$' : 'ل.س'}`);
                    }
                });
            }
        }

        function showRegistrationForm(championship) {
            currentChampionship = championship;
            const isSolo = championship.type === 'solo';
            const priceInfo = getConvertedPrice(championship.price);
            document.getElementById('registerModalTitle').innerHTML = `تسجيل في ${championship.name}`;

            let formHtml = '';
            if (isSolo) {
                formHtml = `
                    <div class="register-form">
                        <div class="register-input-group"><label>اسمك في اللعبة</label><input type="text" id="gameName" placeholder="أدخل اسمك في اللعبة" required></div>
                        <div class="register-input-group"><label>ID الخاص بك</label><input type="text" id="gameId" placeholder="أدخل ID الخاص بك" required></div>
                        <button class="confirm-register-btn" id="finalRegisterBtn">تأكيد التسجيل ودفع ${priceInfo.value} ${priceInfo.symbol}</button>
                    </div>
                `;
            } else {
                formHtml = `
                    <div class="register-form">
                        <div class="register-input-group"><label>اسمك في اللعبة</label><input type="text" id="gameName" placeholder="أدخل اسمك في اللعبة" required></div>
                        <div class="register-input-group"><label>ID الخاص بك</label><input type="text" id="gameId" placeholder="أدخل ID الخاص بك" required></div>
                        <div class="register-input-group"><label>اسم فريقك</label><input type="text" id="teamName" placeholder="أدخل اسم فريقك" required></div>
                        <button class="confirm-register-btn" id="finalRegisterBtn">تأكيد التسجيل ودفع ${priceInfo.value} ${priceInfo.symbol}</button>
                    </div>
                `;
            }

            document.getElementById('registerModalBody').innerHTML = formHtml;
            document.getElementById('registerInfoModal').style.display = 'flex';

            // ربط حدث الزر بعد إضافة HTML
            setTimeout(() => {
                attachConfirmButtonListener();
            }, 50);
        }

        function registerForChampionship(championship) {
            if (isUserJoined(championship.id)) {
                showError(`أنت مسجل بالفعل في بطولة: ${championship.name}`);
                return false;
            }
            if (isChampionshipFull(championship)) {
                showError(`البطولة ممتلئة! الحد الأقصى للاعبين هو ${championship.maxPlayers || 100} لاعب.`);
                return false;
            }
            showRegistrationForm(championship);
            return true;
        }

        function displayChampionships() {
            const grid = document.getElementById('championshipsGrid');
            const savedData = localStorage.getItem('adminChampionships');

            if (!savedData) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-title">لا توجد بطولات حالياً</div><div class="empty-text">سيتم إضافة بطولات قريباً، تابعنا</div></div>`;
                return;
            }

            let championships = JSON.parse(savedData);
            if (championships.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-title">لا توجد بطولات حالياً</div><div class="empty-text">سيتم إضافة بطولات قريباً، تابعنا</div></div>`;
                return;
            }

            championships.sort((a, b) => b.timestamp - a.timestamp);
            allChampionships = championships;

            let filtered = currentFilter !== 'all' ? allChampionships.filter(c => c.game === currentFilter) : allChampionships;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🎮</div><div class="empty-title">لا توجد بطولات في هذا التصنيف</div><div class="empty-text">جرب تصنيفاً آخر</div></div>`;
                return;
            }

            let html = '<div class="championship-grid">';
            for (let champ of filtered) {
                const gameText = champ.game === 'pubg' ? 'ببجي' : 'فري فاير';
                const gameIcon = champ.game === 'pubg' ? '🎮' : '🔥';
                const typeText = champ.type === 'solo' ? 'فردي' : (champ.type === 'duo' ? 'ثنائي' : 'فريق');
                const joined = isUserJoined(champ.id);
                const isFull = isChampionshipFull(champ);
                const currentPlayers = getCurrentPlayersCount(champ.id);
                const maxPlayers = champ.maxPlayers || 100;
                const priceInfo = getConvertedPrice(champ.price);

                html += `
                    <div class="championship-card" data-id="${champ.id}">
                        ${champ.imageData ? `<img src="${champ.imageData}" class="championship-image" alt="${champ.name}">` : `<div class="no-image">${gameIcon}</div>`}
                        <div class="championship-info">
                            <div class="championship-name">${champ.name}</div>
                            <div class="championship-game">${gameText}</div>
                            <div class="championship-desc">${champ.description ? champ.description.substring(0, 150) : ''}${champ.description?.length > 150 ? '...' : ''}</div>
                            <div class="championship-details">
                                <span class="championship-price">💰 ${priceInfo.value} ${priceInfo.symbol}</span>
                                <span class="championship-type">${typeText}</span>
                                <span class="championship-type">${currentPlayers}/${maxPlayers}</span>
                            </div>
                            <button class="register-btn ${joined ? 'joined' : ''} ${isFull && !joined ? 'full' : ''}" data-id="${champ.id}" ${joined || isFull ? 'disabled' : ''}>${joined ? '✅ منضم بالفعل' : (isFull ? 'البطولة ممتلئة' : 'تسجيل الآن')}</button>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            grid.innerHTML = html;

            document.querySelectorAll('.championship-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('register-btn')) return;
                    openChampionshipModal(parseInt(card.getAttribute('data-id')));
                });
            });

            document.querySelectorAll('.register-btn:not(.joined):not(.full)').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.getAttribute('data-id'));
                    const championship = allChampionships.find(c => c.id === id);
                    if (championship) registerForChampionship(championship);
                });
            });
        }

        function openChampionshipModal(id) {
            currentChampionship = allChampionships.find(c => c.id === id);
            if (!currentChampionship) return;

            const gameText = currentChampionship.game === 'pubg' ? 'ببجي' : 'فري فاير';
            const gameIcon = currentChampionship.game === 'pubg' ? '🎮' : '🔥';
            const typeText = currentChampionship.type === 'solo' ? 'فردي' : (currentChampionship.type === 'duo' ? 'ثنائي' : 'فريق');
            const joined = isUserJoined(currentChampionship.id);
            const currentPlayers = getCurrentPlayersCount(currentChampionship.id);
            const maxPlayers = currentChampionship.maxPlayers || 100;
            const priceInfo = getConvertedPrice(currentChampionship.price);

            const modalBody = document.getElementById('modalBody');
            document.getElementById('modalTitle').innerText = currentChampionship.name;

            modalBody.innerHTML = `
                ${currentChampionship.imageData ? `<img src="${currentChampionship.imageData}" style="width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin-bottom:15px;">` : `<div style="height:150px; display:flex; align-items:center; justify-content:center; background-color:#1a1a1a; margin-bottom:15px; border-radius:10px;">${gameIcon} ${gameText}</div>`}
                <div class="info-row"><span class="info-label">اسم البطولة:</span><span class="info-value">${currentChampionship.name}</span></div>
                <div class="info-row"><span class="info-label">نوع اللعبة:</span><span class="info-value">${gameText}</span></div>
                <div class="info-row"><span class="info-label">سعر التسجيل:</span><span class="info-value">${priceInfo.value} ${priceInfo.symbol}</span></div>
                <div class="info-row"><span class="info-label">نوع الفريق:</span><span class="info-value">${typeText}</span></div>
                <div class="info-row"><span class="info-label">عدد اللاعبين:</span><span class="info-value">${currentPlayers} / ${maxPlayers}</span></div>
                <div class="info-row"><span class="info-label">تاريخ الإضافة:</span><span class="info-value">${currentChampionship.date || 'غير محدد'}</span></div>
                <div class="info-row"><span class="info-label">حالة التسجيل:</span><span class="info-value">${joined ? 'منضم بالفعل' : 'غير منضم'}</span></div>
                <div class="description-box"><h3 style="color: #FFD700; margin-bottom: 10px;">وصف البطولة</h3><div class="description-text">${currentChampionship.description || 'لا يوجد وصف لهذه البطولة'}</div></div>
            `;
            document.getElementById('championshipModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('championshipModal').style.display = 'none'; }
        function closeRegisterModal() { document.getElementById('registerInfoModal').style.display = 'none'; }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-game');
                    displayChampionships();
                });
            });
        }

        function setupCurrency() {
            const currencyIcon = document.getElementById('currencyIconBtn');
            const currencyMenu = document.getElementById('currencyMenu');
            const usdBtn = document.getElementById('usdBtnMenu');
            const sypBtn = document.getElementById('sypBtnMenu');

            currencyIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                currencyMenu.style.display = currencyMenu.style.display === 'flex' ? 'none' : 'flex';
            });

            document.addEventListener('click', () => { currencyMenu.style.display = 'none'; });
            currencyMenu.addEventListener('click', (e) => e.stopPropagation());

            usdBtn.addEventListener('click', () => {
                currentCurrency = 'USD';
                currencyMenu.style.display = 'none';
                displayChampionships();
            });

            sypBtn.addEventListener('click', () => {
                currentCurrency = 'SYP';
                currencyMenu.style.display = 'none';
                displayChampionships();
            });
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('closeRegisterModalBtn').addEventListener('click', closeRegisterModal);
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('championshipModal')) closeModal();
            if (e.target === document.getElementById('registerInfoModal')) closeRegisterModal();
        });

        window.addEventListener('storage', () => displayChampionships());

        loadTheme();
        setupFilters();
        setupCurrency();
        displayChampionships();
    </script>
</body>

</html>
