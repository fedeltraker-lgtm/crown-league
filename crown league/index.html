<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - البطولات الإلكترونية</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* خلفية شفافة */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('panner.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
        }

        /* اللوجو */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo img {
            height: 60px;
            width: auto;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .main-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #CCCCCC;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .btn-register {
            background-color: #000000;
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.05);
        }

        .btn-login {
            background-color: #FFD700;
            color: #000000;
            border: 2px solid #FFD700;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.05);
        }

        .stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .stat-box {
            background-color: rgba(17, 17, 17, 0.8);
            border: 1px solid #FFD700;
            border-radius: 15px;
            padding: 20px 35px;
            min-width: 130px;
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #FFD700;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-top: 5px;
        }

        .games-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .games-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .game-card {
            text-align: center;
            background-color: rgba(10, 10, 10, 0.7);
            padding: 15px;
            border-radius: 15px;
            transition: transform 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .game-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        .game-card p {
            margin-top: 8px;
            font-weight: bold;
        }

        .disclaimer {
            margin-top: 40px;
            color: #888;
            font-size: 0.8rem;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .stat-box {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: #000000;
        }

        body.light-mode .stat-number {
            color: #000000;
        }

        body.light-mode .game-card {
            background-color: rgba(255, 255, 255, 0.9);
        }

        body.light-mode .disclaimer {
            border-top-color: #ddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Crown League">
            <h1>CROWN LEAGUE</h1>
        </div>
        <p class="main-text">انضم إلى أكبر البطولات الإلكترونية بجوائز عالية</p>

        <div class="buttons">
            <a href="signup.html" class="btn-register">تسجيل</a>
            <a href="signin.html" class="btn-login">دخول</a>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">1.2M+</div>
                <div class="stat-label">لاعب نشط</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">850+</div>
                <div class="stat-label">بطولة منتهية</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">$2.5M</div>
                <div class="stat-label">جوائز مقدمة</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">150+</div>
                <div class="stat-label">دولة مشاركة</div>
            </div>
        </div>

        <div class="games-title">🏆 أهم الألعاب 🏆</div>
        <div class="games-container">
            <div class="game-card">
                <img src="freefire.png" alt="Free Fire"
                    onerror="this.src='https://via.placeholder.com/100?text=FreeFire'">
                <p>فري فاير</p>
            </div>
            <div class="game-card">
                <img src="pubg.png" alt="PUBG" onerror="this.src='https://via.placeholder.com/100?text=PUBG'">
                <p>ببجي</p>
            </div>
        </div>

        <div class="disclaimer">
            نحن شركة مستقلة ولا يصلنا اي علاقة بشركات الالعاب التي ندعمها وشكرا
        </div>
    </div>

    <script>
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }
        loadTheme();

        window.addEventListener('storage', function (e) {
            if (e.key === 'theme') {
                if (e.newValue === 'light') {
                    document.body.classList.add('light-mode');
                } else {
                    document.body.classList.remove('light-mode');
                }
            }
        });
    </script>
</body>

</html>
