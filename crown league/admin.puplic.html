<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - إدارة الدردشة العامة</title>

    
    <script src="check-auth.js">
        // ========== تحسين الأداء مع الحفاظ على التوافق ==========

            // 1. تحسين القراءة - إضافة طبقة تخزين مؤقت فقط (لا نستبدل localStorage)
            const readCache = new Map();
            const CACHE_TTL = 500; // نصف ثانية

            function fastRead(key) {
                // محاولة القراءة من الكاش أولاً
                if (readCache.has(key)) {
                    const { value, timestamp } = readCache.get(key);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        return value;
                    }
                }

                // إذا انتهت صلاحية الكاش، نقرأ من localStorage
                const value = localStorage.getItem(key);
                readCache.set(key, { value, timestamp: Date.now() });
                return value;
            }

            // 2. تحسين الكتابة - الكتابة المباشرة مع تحديث الكاش
            function fastWrite(key, value) {
                // تحديث الكاش أولاً
                readCache.set(key, { value, timestamp: Date.now() });
                // الكتابة مباشرة في localStorage (لا نغير الآلية الأصلية)
                localStorage.setItem(key, value);
            }

            // 3. استخدام الدوال المحسنة بدلاً من localStorage مباشرة
            // ملاحظة: هذا آمن لأن localStorage لا يزال يعمل بشكل طبيعي

            // مثال للاستخدام الآمن:
            const users = JSON.parse(fastRead('users') || '[]');
            fastWrite('users', JSON.stringify(users));
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #888;
        }

        /* أزرار التحكم */
        .control-buttons {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            gap: 10px;
        }

        .clear-btn {
            background-color: #AA0000;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .clear-btn:hover {
            transform: scale(1.02);
            background-color: #cc0000;
        }

        .chat-container {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            overflow: hidden;
        }

        .chat-messages {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message.sent {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            background-color: #1a1a1a;
            color: #FFD700;
        }

        .message.sent .message-bubble {
            background-color: #FFD700;
            color: #000000;
        }

        .message-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
            margin-right: 10px;
            margin-left: 10px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #FFD700;
            gap: 10px;
            background-color: #0a0a0a;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }

        .empty-chat {
            text-align: center;
            color: #666;
            padding: 40px;
        }

        body.light-mode {
            background-color: #f5f5f5;
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            color: #000000;
        }

        body.light-mode .back-link a {
            color: #000000;
        }

        body.light-mode .chat-container {
            background-color: #ffffff;
            border-color: #000000;
        }

        body.light-mode .message-bubble {
            background-color: #e0e0e0;
            color: #000000;
        }

        body.light-mode .message.sent .message-bubble {
            background-color: #000000;
            color: #ffffff;
        }

        body.light-mode .chat-input {
            background-color: #f0f0f0;
            border-color: #000000;
            color: #000000;
        }

        body.light-mode .clear-btn {
            background-color: #cc0000;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="dashboard.html"></a>
        </div>

        <h1>👑 إدارة الدردشة العامة</h1>
        <div class="subtitle">إرسال رسائل إلى جميع المستخدمين</div>

        <div class="control-buttons">
            <button class="clear-btn" id="clearChatBtn">🗑️ مسح السجل بالكامل</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">💬 لا توجد رسائل بعد</div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput"
                    placeholder="اكتب رسالتك هنا... (ستظهر لجميع المستخدمين)">
                <button class="send-btn" id="sendBtn">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let chatInterval = null;

        function loadMessages() {
            const messages = localStorage.getItem('publicChat');
            const chatDiv = document.getElementById('chatMessages');

            if (!messages || JSON.parse(messages).length === 0) {
                chatDiv.innerHTML = '<div class="empty-chat">💬 لا توجد رسائل بعد</div>';
                return;
            }

            const allMessages = JSON.parse(messages);
            chatDiv.innerHTML = '';

            allMessages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.innerHTML = `
                    <div class="message-bubble">${msg.text}</div>
                    <div class="message-info">👑 الإدمن • ${msg.time}</div>
                `;
                chatDiv.appendChild(messageDiv);
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === '') return;

            let messages = localStorage.getItem('publicChat');
            if (messages) {
                messages = JSON.parse(messages);
            } else {
                messages = [];
            }

            messages.push({
                text: text,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem('publicChat', JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        function clearAllMessages() {
            if (confirm('⚠️ هل أنت متأكد من مسح سجل الدردشة بالكامل؟ هذا الإجراء لا يمكن التراجع عنه.')) {
                localStorage.removeItem('publicChat');
                loadMessages();
                alert('✅ تم مسح سجل الدردشة بنجاح');
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('clearChatBtn').addEventListener('click', clearAllMessages);

        function startChatListener() {
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(() => {
                loadMessages();
            }, 3000);
        }

        startChatListener();
        loadMessages();

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        window.addEventListener('storage', function (e) {
            if (e.key === 'theme') {
                if (e.newValue === 'light') {
                    document.body.classList.add('light-mode');
                } else {
                    document.body.classList.remove('light-mode');
                }
            }
            if (e.key === 'publicChat') {
                loadMessages();
            }
        });

        loadTheme();
    </script>
</body>

</html>
