<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - شحن عن طريق سيريتل كاش</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="check-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 550px;
            width: 100%;
        }

        .back-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #CCCCCC;
        }

        .bank-number {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .bank-number label {
            display: block;
            font-size: 0.9rem;
            color: #CCCCCC;
            margin-bottom: 10px;
        }

        .number-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .number {
            font-size: 1.8rem;
            font-weight: bold;
            background-color: #1a1a1a;
            padding: 10px 20px;
            border-radius: 10px;
            letter-spacing: 2px;
        }

        .copy-btn {
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            transition: transform 0.2s;
        }

        .copy-btn:hover {
            transform: scale(1.05);
        }

        .deposit-form {
            background-color: #0a0a0a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #FFD700;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #FFD700;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            font-family: Arial, sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            background-color: #00AA00;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            background-color: #00cc00;
        }

        .success-msg {
            color: #00AA00;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="select-payment.html">← العودة إلى طرق الدفع</a>
        </div>

        <h1>شحن عن طريق سيريتل كاش</h1>
        <div class="subtitle">قم بتحويل المبلغ إلى الرقم التالي (سيريتل كاش) ثم أدخل بيانات التحويل</div>

        <div class="bank-number">
            <label>📞 رقم سيريتل كاش (للنسخ)</label>
            <div class="number-container">
                <div class="number" id="phoneNumber">0984941745</div>
                <button class="copy-btn" id="copyBtn">نسخ</button>
            </div>
        </div>

        <div class="deposit-form">
            <form id="depositForm">
                <div class="input-group">
                    <label>الاسم كاملاً</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
                </div>
                <div class="input-group">
                    <label>الرقم المحول منه</label>
                    <input type="text" id="fromNumber" placeholder="أدخل الرقم الذي حولت منه" required>
                </div>
                <div class="input-group">
                    <label>رقم عملية التحويل</label>
                    <input type="text" id="transactionId" placeholder="أدخل رقم عملية التحويل" required>
                </div>
                <div class="input-group">
                    <label>كمية الشحن (بالدولار USD)</label>
                    <input type="number" id="amount" placeholder="أدخل المبلغ" required>
                </div>
                <button type="submit" class="btn-submit">إرسال طلب الشحن</button>
            </form>
            <div class="success-msg" id="successMsg">✅ تم إرسال طلب الشحن بنجاح، سيتم مراجعته قريباً</div>
        </div>
    </div>

    <script>
        const copyBtn = document.getElementById('copyBtn');
        const phoneNumber = document.getElementById('phoneNumber');
        const depositForm = document.getElementById('depositForm');
        const successMsg = document.getElementById('successMsg');

        copyBtn.addEventListener('click', function () {
            const number = phoneNumber.innerText;
            navigator.clipboard.writeText(number).then(function () {
                alert('تم نسخ الرقم: ' + number);
            });
        });

        function getCurrentUser() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                return JSON.parse(savedUser);
            }
            return { username: 'زائر', email: '' };
        }

        depositForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const fromNumber = document.getElementById('fromNumber').value.trim();
            const transactionId = document.getElementById('transactionId').value.trim();
            const amount = document.getElementById('amount').value.trim();

            if (!fullName || !fromNumber || !transactionId || !amount) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                alert('الرجاء إدخال مبلغ صحيح');
                return;
            }

            const currentUser = getCurrentUser();
            const now = new Date();

            const newRequest = {
                id: now.getTime(),
                fullName: fullName,
                username: currentUser.username,
                email: currentUser.email,
                fromNumber: fromNumber,
                transactionId: transactionId,
                amount: parseFloat(amount),
                paymentMethod: 'سيريتل كاش',
                status: 'pending',
                date: now.toLocaleString('ar-EG')
            };

            // الحصول على الطلبات الحالية
            let allRequests = localStorage.getItem('depositRequests');
            if (!allRequests) {
                allRequests = [];
            } else {
                allRequests = JSON.parse(allRequests);
            }

            // إضافة الطلب الجديد
            allRequests.push(newRequest);

            // حفظ الطلبات
            localStorage.setItem('depositRequests', JSON.stringify(allRequests));

            // تأكيد الحفظ
            const saved = localStorage.getItem('depositRequests');
            console.log('تم الحفظ:', saved);

            // تفريغ الحقول
            document.getElementById('fullName').value = '';
            document.getElementById('fromNumber').value = '';
            document.getElementById('transactionId').value = '';
            document.getElementById('amount').value = '';

            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 5000);
        });
    </script>
</body>

</html>
