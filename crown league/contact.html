<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown League - اتصل بنا</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="check-auth.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #0a0a0a;
            border: 1px solid #FFD700;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 5px;
            color: #FFD700;
        }

        button {
            background-color: #FFD700;
            color: #000000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #ffea70;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #FFD700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📧 اتصل بنا</h1>
        <form name="contact" netlify>
            <p>
                <label>الاسم</label>
                <input type="text" name="name" required>
            </p>
            <p>
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" required>
            </p>
            <p>
                <label>الرسالة</label>
                <textarea name="message" rows="5" required></textarea>
            </p>
            <p>
                <button type="submit">إرسال</button>
            </p>
        </form>
        <div class="back-link">
            <a href="dashboard.html">← العودة إلى لوحة التحكم</a>
        </div>
    </div>
</body>

</html>
